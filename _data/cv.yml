    Projects:
      - name: Synthesis of a New Asymmetric Thiocarbohydrazone and the Investigation of the Mo(VI) Complex
        summary: I am the project coordinator for a university-funded research project focused on the molecular hybridization of isatin-based thiocarbohydrazones. Responsibilities include the design and synthesis of novel ONS-donor ligands and their Mo(VI) complexes to investigate their potential as bio-active scaffolds and molybdoenzyme models. The study employs advanced characterization techniques, including NMR, FT-IR, and Mass Spectrometry, to assess the pharmacological significance of the synthesized compounds.
        start_date: 2026-02-01
        end_date: present

      - name: Keratin-Based Bioplastic Production from Waste Hair and Environmental Impact Assessment
        summary: I participated as a team member in the development of keratin-based bioplastic materials from waste hair. The project focused on sustainable material production and the assessment of biodegradation behavior and environmental impact, including potential effects on soil, within the Biotechnology and Innovation category of Teknofest 2024.
